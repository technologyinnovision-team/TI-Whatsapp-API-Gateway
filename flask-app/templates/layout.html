<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <title>WhatsApp Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-900 text-slate-50 overflow-hidden h-screen flex">

    <!-- Sidebar -->
    <aside
        class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col h-full shrink-0 transition-all duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <div class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-500 bg-clip-text text-transparent">
                <i class="fab fa-whatsapp mr-2"></i> WA Platform
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2">
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard') }}"
                class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors {{ 'bg-slate-700 text-emerald-400' if request.endpoint == 'dashboard' else 'text-slate-400 hover:text-white' }}">
                <i class="fas fa-grid-2 w-6"></i>
                <span class="font-medium">Dashboard</span>
            </a>

            <a href="{{ url_for('docs') }}" target="_blank"
                class="flex items-center px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">
                <i class="fas fa-book w-6"></i>
                <span class="font-medium">API Docs</span>
            </a>

            <div class="pt-6 mt-6 border-t border-slate-700 px-2">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">User</div>
                <div class="flex items-center px-2 py-2 mb-4">
                    <div
                        class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold text-xs">
                        {{ current_user.username[0].upper() }}
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-white">{{ current_user.username }}</p>
                        <p class="text-xs text-slate-500">Pro Plan</p>
                    </div>
                </div>

                <a href="{{ url_for('logout') }}"
                    class="flex items-center px-4 py-2 rounded-lg text-red-400 hover:bg-slate-700/50 hover:text-red-300 transition-colors text-sm">
                    <i class="fas fa-sign-out-alt w-6"></i>
                    <span>Logout</span>
                </a>
            </div>
            {% else %}
            <a href="{{ url_for('login') }}"
                class="flex items-center px-4 py-3 rounded-lg {{ 'bg-slate-700 text-emerald-400' if request.endpoint == 'login' else 'text-slate-400 hover:text-white' }}">
                <i class="fas fa-sign-in-alt w-6"></i>
                <span>Login</span>
            </a>
            <a href="{{ url_for('signup') }}"
                class="flex items-center px-4 py-3 rounded-lg {{ 'bg-slate-700 text-emerald-400' if request.endpoint == 'signup' else 'text-slate-400 hover:text-white' }}">
                <i class="fas fa-user-plus w-6"></i>
                <span>Sign Up</span>
            </a>
            {% endif %}
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-slate-900 relative">
        <div class="container mx-auto px-8 py-8 max-w-6xl">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>

</html>
