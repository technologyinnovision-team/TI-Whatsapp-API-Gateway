{% extends "layout.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-8 w-full max-w-md shadow-2xl">
        <h1 class="text-3xl font-bold text-center mb-2">Create Account</h1>
        <p class="text-slate-400 text-center mb-8">Start your journey with us</p>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-500 p-3 rounded mb-6 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Choose
                    Username</label>
                <input type="text" name="username"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors"
                    placeholder="e.g. johndoe" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Choose
                    Password</label>
                <input type="password" name="password"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors"
                    placeholder="••••••••" required>
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition-colors mt-2">
                Get Started <i class="fas fa-rocket ml-2 opacity-70"></i>
            </button>
        </form>

        <p class="mt-8 text-center text-slate-400 text-sm">
            Already have an account? <a href="{{ url_for('login') }}"
                class="text-emerald-400 hover:text-emerald-300 font-medium">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
