[supervisord]
logfile=/home/tistack-wpapp/htdocs/wpapp.tistack.online/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/home/tistack-wpapp/htdocs/wpapp.tistack.online/supervisord.pid

[unix_http_server]
file=/home/tistack-wpapp/htdocs/wpapp.tistack.online/supervisor.sock   ; (the path to the socket file)

[supervisorctl]
serverurl=unix:///home/tistack-wpapp/htdocs/wpapp.tistack.online/supervisor.sock ; use a unix:// URL  for a unix socket

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:flask-app]
command=/home/tistack-wpapp/htdocs/wpapp.tistack.online/venv/bin/gunicorn -w 4 -b 127.0.0.1:8000 app:app
directory=/home/tistack-wpapp/htdocs/wpapp.tistack.online/flask-app
autostart=true
autorestart=true
stdout_logfile=/home/tistack-wpapp/htdocs/wpapp.tistack.online/flask-app.out.log
stderr_logfile=/home/tistack-wpapp/htdocs/wpapp.tistack.online/flask-app.err.log
environment=programs="flask"

[program:wa-bridge]
command=/usr/bin/node server.js
directory=/home/tistack-wpapp/htdocs/wpapp.tistack.online/wa-bridge
autostart=true
autorestart=true
stdout_logfile=/home/tistack-wpapp/htdocs/wpapp.tistack.online/wa-bridge.out.log
stderr_logfile=/home/tistack-wpapp/htdocs/wpapp.tistack.online/wa-bridge.err.log
environment=programs="node"
